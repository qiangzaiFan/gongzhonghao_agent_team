<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>十二星座每日好运丨2026.08.01 薄荷绿卡片预览</title>
  <style>
    :root {
      --mint: #66b985;
      --mint-deep: #3f8962;
      --mint-soft: #d8f0df;
      --rose: #d36a82;
      --ink: #41584c;
      --paper: #fbfffc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #eeeeee;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    .page {
      width: min(100%, 430px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 36px 16px 48px;
      background:
        radial-gradient(circle at 92% 0%, rgba(211, 106, 130, 0.14) 0 82px, transparent 83px),
        linear-gradient(180deg, #ffffff 0%, var(--paper) 100%);
    }

    h1 {
      margin: 0;
      color: var(--mint-deep);
      font-size: 26px;
      font-weight: 850;
      line-height: 1.32;
      text-align: center;
      letter-spacing: 0;
    }

    .intro {
      margin: 14px auto 40px;
      color: #6d7f73;
      font-size: 14px;
      line-height: 1.7;
      text-align: center;
    }

    .group {
      margin-top: 42px;
    }

    .group-title {
      position: relative;
      z-index: 0;
      isolation: isolate;
      width: max-content;
      margin: 0 auto 18px;
      padding: 8px 40px 9px;
      border: 1.5px solid var(--mint-soft);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      color: var(--mint-deep);
      font-size: 24px;
      font-weight: 850;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .group-title span {
      position: relative;
      z-index: 2;
    }

    .group-title::before,
    .group-title::after {
      content: "";
      position: absolute;
      z-index: 1;
      top: -18px;
      width: 32px;
      height: 26px;
      border: 1.5px solid var(--mint-soft);
      border-bottom: 0;
      border-radius: 24px 24px 0 0;
      background: #fff;
    }

    .group-title::before {
      left: 42px;
    }

    .group-title::after {
      right: 42px;
    }

    .card-panel {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      padding: 10px 8px;
      border: 1.5px solid #bfe5cb;
      border-radius: 22px;
      background: linear-gradient(135deg, #f2fbf5, #ffffff);
    }

    img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 6px;
      box-shadow: 0 4px 12px rgba(63, 137, 98, 0.14);
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>十二星座每日好运丨2026.08.01</h1>
    <p class="intro">薄荷绿 A/B 版卡片预览，主色偏青提奶绿，保留少量玫粉点缀。</p>

    <section class="group">
      <h2 class="group-title"><span>火象星座</span></h2>
      <div class="card-panel">
        <img src="../assets/daily_fortune_cards/20260801_mint/白羊座.svg" alt="白羊座每日好运卡">
        <img src="../assets/daily_fortune_cards/20260801_mint/狮子座.svg" alt="狮子座每日好运卡">
        <img src="../assets/daily_fortune_cards/20260801_mint/射手座.svg" alt="射手座每日好运卡">
      </div>
    </section>

    <section class="group">
      <h2 class="group-title"><span>土象星座</span></h2>
      <div class="card-panel">
        <img src="../assets/daily_fortune_cards/20260801_mint/金牛座.svg" alt="金牛座每日好运卡">
        <img src="../assets/daily_fortune_cards/20260801_mint/处女座.svg" alt="处女座每日好运卡">
        <img src="../assets/daily_fortune_cards/20260801_mint/摩羯座.svg" alt="摩羯座每日好运卡">
      </div>
    </section>

    <section class="group">
      <h2 class="group-title"><span>风象星座</span></h2>
      <div class="card-panel">
        <img src="../assets/daily_fortune_cards/20260801_mint/双子座.svg" alt="双子座每日好运卡">
        <img src="../assets/daily_fortune_cards/20260801_mint/天秤座.svg" alt="天秤座每日好运卡">
        <img src="../assets/daily_fortune_cards/20260801_mint/水瓶座.svg" alt="水瓶座每日好运卡">
      </div>
    </section>

    <section class="group">
      <h2 class="group-title"><span>水象星座</span></h2>
      <div class="card-panel">
        <img src="../assets/daily_fortune_cards/20260801_mint/巨蟹座.svg" alt="巨蟹座每日好运卡">
        <img src="../assets/daily_fortune_cards/20260801_mint/天蝎座.svg" alt="天蝎座每日好运卡">
        <img src="../assets/daily_fortune_cards/20260801_mint/双鱼座.svg" alt="双鱼座每日好运卡">
      </div>
    </section>
  </main>
</body>
</html>
